name: CI - Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for Qt offscreen rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-glx libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run complete test suite (111 tests)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v

  rpm-build:
    name: Universal RPM Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rpm packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm gcc make

      - name: Build universal noarch RPM
        run: |
          bash packaging/build-rpm.sh

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conftune-fc-rpms
          path: dist/*.rpm
